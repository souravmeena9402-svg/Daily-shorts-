name: Daily Short

on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - upload

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg flite fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render Short
        run: |
          python render.py 0

      - name: Upload Artifact (Preview)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview
          path: output/
          retention-days: 7
